user  root;
worker_processes  2;

load_module "modules/ngx_http_headers_more_filter_module.so";

error_log /var/log/nginx/error.log debug;

events {
    worker_connections  128;
}

http {
    server_tokens off;
    proxy_buffers 48 16k;
    proxy_buffer_size 16k;
    proxy_busy_buffers_size 24k;

    proxy_cache_path /tmp/cache levels=1:2 keys_zone=cache:60m max_size=1G use_temp_path=off;
    proxy_cache_methods GET HEAD;

    proxy_redirect     off;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Host $host;
    # proxy_set_header   Connection "";

    server {
        access_log /var/log/nginx/access.log combined;
        listen       443 ssl;
        http2        on;
        server_name $NGINX_DOMAIN;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            return 444;
        }

        location /wireguardweb/ {
            proxy_pass http://wg_easy:51821/;
            proxy_connect_timeout 3s;
            proxy_http_version 1.1;
            proxy_set_header   X-NginX-Proxy true;

            proxy_cache          cache;
            proxy_cache_key      $host$uri$is_args$args;
            proxy_cache_valid    200 301 302 30m;
            proxy_cache_valid    404         10m;
            # Uncomment the following line if needed;
            # allow %INSERT_YOU_IPS%;
            # deny all;
        }

        # include prometheus config
        include /etc/nginx/conf.d/prom.conf;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
    }

    server {
        access_log /var/log/nginx/access.log combined;
        listen       80;
        server_name  $NGINX_DOMAIN;

        location / {
            return 301 https://$NGINX_DOMAIN$request_uri;
        }
    }

    server {
        listen 80 default_server;

        server_name "";
        return 444;
    }

}

include /etc/nginx/conf.d/wg_proxy.conf;
