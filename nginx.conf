user  root;
worker_processes  2;

load_module "modules/ngx_http_headers_more_filter_module.so";

error_log /var/log/nginx/error.log debug;

events {
    worker_connections  1000;
    use epoll;
    multi_accept on;
}

http {
    server_tokens off;
    proxy_buffers 24 8k;
    proxy_buffer_size 8k;
    proxy_busy_buffers_size 24k;

    proxy_cache_path /tmp/cache levels=1:2 keys_zone=cache:60m max_size=1G use_temp_path=off;
    proxy_cache_methods GET HEAD;

    proxy_redirect     off;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Host $host;
    # proxy_set_header   Connection "";

    tcp_nodelay on;

    # include /etc/nginx/conf.d/domain_https.conf;
    include /etc/nginx/conf.d/domain_http.conf;

    server {
        listen 80 default_server;

        server_name "";
        return 444;
    }

}

include /etc/nginx/conf.d/wg_proxy.conf;
